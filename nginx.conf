# ==============================================================================
# S&T Indicator Studio - Production Nginx Reverse Proxy Configuration
# Place in: /etc/nginx/sites-available/st-indicator-studio
# Enable: sudo ln -s /etc/nginx/sites-available/st-indicator-studio /etc/nginx/sites-enabled/
# SSL: sudo certbot --nginx -d your-domain.com
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Redirect all HTTP requests to HTTPS
    # return 301 https://$host$request_uri;

    # Client body limit for screenshot uploads & PDF generation
    client_max_body_size 60M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket & Server-Sent Events headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long AI requests and PDF generation
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
    }

    # Dedicated Webhook Route for TradingView Alerts
    location /api/webhook/tradingview {
        proxy_pass http://127.0.0.1:3000/api/webhook/tradingview;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
